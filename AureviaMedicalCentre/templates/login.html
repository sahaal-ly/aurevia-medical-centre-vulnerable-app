{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}
{% block body %}<div class="auth-wrap"><div class="auth-card reveal">
 <div class="text-center mb-4"><img src="{{ url_for('static', filename='logo.svg') }}" width="56" alt=""><h3 class="mt-3 mb-1">{{ title }}</h3><p class="text-muted">{{ subtitle }}</p></div>
 {% if error %}<div class="alert alert-danger border-0 rounded-3">{{ error }}</div>{% endif %}
 <form method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label fw-semibold">Username</label><input name="username" class="form-control" required autofocus autocomplete="username"></div>
  <div class="mb-4"><label class="form-label fw-semibold">Password</label><input type="password" name="password" class="form-control" required autocomplete="current-password"></div>
  <button class="btn btn-brand w-100 py-2">Sign in</button></form>
 {% if role=='patient' %}<p class="text-center small text-muted mt-4 mb-0">New here? <a href="{{ url_for('main.register') }}">Create an account</a></p>{% endif %}
</div></div>{% endblock %}
